<!DOCTYPE html>

<title>Email preferences — UK Talent Link</title>

<style>.mq{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:18px 0;overflow:hidden}.mini{border:1px solid var(--rule);border-radius:12px;padding:20px;display:grid;gap:12px;margin-top:28px;background:var(--paper);font-size:13px;box-shadow:var(--shadow)}.mini .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute)}.xbanner{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 18px;border:1px solid var(--rule);border-radius:10px;background:var(--paper-deep);font-size:14px;margin-top:36px}.xbanner a{white-space:nowrap}.jg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}.jg>div{background:var(--paper-deep);padding:28px;display:grid;gap:10px;align-content:start}.jg .n{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--ink-mute)}.jg h4{font-family:var(--display);font-weight:300;font-size:22px;line-height:1.1}.jg p{font-size:13px;color:var(--ink-soft)}.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.cards3>div{border:1px solid var(--rule);border-radius:12px;padding:28px;display:grid;gap:12px;align-content:start;background:var(--paper)}.cards3 h4{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:-.015em;line-height:1.1}.cards3 p{font-size:14px;color:var(--ink-soft)}.faq details{border-top:1px solid var(--rule);padding:20px 0}.faq details:last-child{border-bottom:1px solid var(--rule)}.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:16px;font-family:var(--display);font-size:clamp(18px,1.8cqi,22px);letter-spacing:-.01em}.faq summary::-webkit-details-marker{display:none}.faq summary::after{content:"+";font-family:var(--mono);color:var(--ink-mute);transition:transform .3s}.faq details[open] summary::after{transform:rotate(45deg)}.faq details p{color:var(--ink-soft);margin-top:10px;max-width:64ch}@container (max-width:1000px){.jg{grid-template-columns:1fr 1fr}.cards3{grid-template-columns:1fr}}@container (max-width:720px){.jg{grid-template-columns:1fr}}</style>
</head>
<body class="site" data-nofoot="1" data-page="unsub" data-for="candidate">

<section style="min-height:100vh;display:grid;place-items:center;padding:160px 24px 80px"><div class="card" style="max-width:520px;width:100%;padding:36px;border:1px solid var(--rule);border-radius:16px;display:grid;gap:20px" id="up">
<div><div class="eyebrow">Email preferences</div><h1 class="disp" style="font-size:40px;margin-top:14px">Choose what we <em style="color:var(--accent)">send you.</em></h1><p class="soft" style="margin-top:10px;font-size:14px">Managing emails for <b style="color:var(--ink);font-weight:500">amara.okafor@email.com</b></p></div>
<div style="display:grid;gap:10px"><label style="display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--rule);border-radius:10px;cursor:pointer"><input type="checkbox" checked  style="width:18px;height:18px;accent-color:var(--ink)"><span><b style="font-weight:500;display:block">Job updates</b><small style="color:var(--ink-mute);font-size:12px">New roles that match your CV</small></span></label><label style="display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--rule);border-radius:10px;cursor:pointer"><input type="checkbox" checked  style="width:18px;height:18px;accent-color:var(--ink)"><span><b style="font-weight:500;display:block">Campaigns</b><small style="color:var(--ink-mute);font-size:12px">Occasional updates about sectors and markets</small></span></label><label style="display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--rule);border-radius:10px;cursor:pointer"><input type="checkbox" checked disabled style="width:18px;height:18px;accent-color:var(--ink)"><span><b style="font-weight:500;display:block">Account emails</b><small style="color:var(--ink-mute);font-size:12px">Sign-in, bookings and messages. Required for your account.</small></span></label></div>
<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-ink" onclick="document.getElementById('up').innerHTML='<div class=&quot;eyebrow&quot;>Saved</div><h2 class=&quot;disp&quot; style=&quot;font-size:34px&quot;>Preferences updated.</h2><p class=&quot;soft&quot;>Changes take effect within 24 hours.</p><a href=&quot;UKTL Landing.html&quot; class=&quot;btn&quot; style=&quot;justify-self:start&quot;>Back to the site</a>'">Save preferences</button><button class="btn" onclick="document.getElementById('up').innerHTML='<div class=&quot;eyebrow&quot;>Unsubscribed</div><h2 class=&quot;disp&quot; style=&quot;font-size:34px&quot;>You won’t get marketing emails.</h2><p class=&quot;soft&quot;>We’ll still send account emails like sign-in and booking confirmations.</p><a href=&quot;UKTL Landing.html&quot; class=&quot;btn&quot; style=&quot;justify-self:start&quot;>Back to the site</a>'">Unsubscribe from all marketing</button></div>
</div></section>
