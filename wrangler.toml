name = "talent-compass"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# Main entry point generated by TanStack Start build
main = ".output/server/index.mjs"

[site]
bucket = ".output/public"

# ── D1 Database ────────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "talent-compass-db"
database_id   = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# ── R2 Object Storage (CV files) ──────────────────────────────────────────────
[[r2_buckets]]
binding    = "CV_BUCKET"
bucket_name = "talent-compass-cvs"

# ── Secrets (set via `wrangler secret put`) ────────────────────────────────────
# ANTHROPIC_API_KEY   — Claude API key for CV parsing and AI features
# RESEND_API_KEY      — Transactional email (candidate notifications)
# JWT_SECRET          — HMAC-SHA256 signing key for admin session tokens
# ADMIN_PASSWORD_HASH — PBKDF2 hash of admin password (see src/lib/server/auth.ts)

# ── Environment: staging ──────────────────────────────────────────────────────
[env.staging]
name = "talent-compass-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "talent-compass-staging-db"
database_id   = "REPLACE_WITH_STAGING_D1_DATABASE_ID"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding    = "CV_BUCKET"
bucket_name = "talent-compass-cvs-staging"

# ── Environment: production ───────────────────────────────────────────────────
[env.production]
name = "talent-compass-production"
route = { pattern = "talent-compass.cranbrooklegal.com/*", zone_name = "cranbrooklegal.com" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "talent-compass-db"
database_id   = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding    = "CV_BUCKET"
bucket_name = "talent-compass-cvs"
