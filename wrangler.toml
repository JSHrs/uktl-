name = "talent-compass"
compatibility_date = "2025-09-24"
compatibility_flags = ["nodejs_compat"]

# `npm run build` (Nitro, cloudflare-module preset) emits a prebuilt ES-module
# Worker in dist/server and static assets in dist/client. See DEPLOYMENT.md §3.
main = "dist/server/index.mjs"
no_bundle = true

[[rules]]
type = "ESModule"
globs = ["**/*.mjs", "**/*.js"]

[assets]
directory = "dist/client"
binding = "ASSETS"

# ── D1 Database ────────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "talent-compass-db"
database_id   = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# ── R2 Object Storage (CV files) ──────────────────────────────────────────────
[[r2_buckets]]
binding    = "CV_BUCKET"
bucket_name = "talent-compass-cvs"

# ── Supabase public vars (safe to expose in source) ──────────────────────────
[vars]
SUPABASE_URL      = "https://REPLACE_WITH_SUPABASE_PROJECT_REF.supabase.co"
SUPABASE_ANON_KEY = "REPLACE_WITH_SUPABASE_ANON_KEY"
CALENDLY_URL      = ""   # Set to client's Calendly embed URL once provided
SITE_URL          = "http://localhost:5173"   # Public origin; must also be in Supabase Auth > Redirect URLs

# ── Secrets (set via `wrangler secret put`) ────────────────────────────────────
# ANTHROPIC_API_KEY          — Claude API key for CV parsing and AI features
# RESEND_API_KEY             — Transactional email (candidate notifications)
# JWT_SECRET                 — HMAC-SHA256 signing key for admin session tokens
# ADMIN_PASSWORD_HASH        — PBKDF2 hash of admin password (see src/lib/server/auth.ts)
# SUPABASE_SERVICE_ROLE_KEY  — Supabase service role key (bypasses RLS, server-only)
# REED_API_KEY               — Reed.co.uk job board API key

# ── Environment: staging ──────────────────────────────────────────────────────
[env.staging]
name = "talent-compass-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "talent-compass-staging-db"
database_id   = "REPLACE_WITH_STAGING_D1_DATABASE_ID"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding    = "CV_BUCKET"
bucket_name = "talent-compass-cvs-staging"

[env.staging.assets]
directory = "dist/client"
binding = "ASSETS"

# `vars` are not inherited by named environments — redeclare per environment.
[env.staging.vars]
SUPABASE_URL      = "https://REPLACE_WITH_SUPABASE_PROJECT_REF.supabase.co"
SUPABASE_ANON_KEY = "REPLACE_WITH_SUPABASE_ANON_KEY"
CALENDLY_URL      = ""
SITE_URL          = "https://talent-compass-staging.REPLACE_WITH_WORKERS_SUBDOMAIN.workers.dev"

# ── Environment: production ───────────────────────────────────────────────────
[env.production]
name = "talent-compass-production"
route = { pattern = "talent-compass.cranbrooklegal.com/*", zone_name = "cranbrooklegal.com" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "talent-compass-db"
database_id   = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding    = "CV_BUCKET"
bucket_name = "talent-compass-cvs"

[env.production.assets]
directory = "dist/client"
binding = "ASSETS"

[env.production.vars]
SUPABASE_URL      = "https://REPLACE_WITH_SUPABASE_PROJECT_REF.supabase.co"
SUPABASE_ANON_KEY = "REPLACE_WITH_SUPABASE_ANON_KEY"
CALENDLY_URL      = ""
SITE_URL          = "https://talent-compass.cranbrooklegal.com"
