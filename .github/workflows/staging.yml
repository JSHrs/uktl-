name: Staging deployment and authenticated checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uktl-staging
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      REED_API_KEY: ${{ secrets.REED_API_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      CALENDLY_URL: ${{ vars.CALENDLY_URL }}
      CALENDLY_EVENT_TYPE_URI: ${{ vars.CALENDLY_EVENT_TYPE_URI }}
      CALENDLY_API_TOKEN: ${{ secrets.CALENDLY_API_TOKEN }}
      CALENDLY_WEBHOOK_SECRET: ${{ secrets.CALENDLY_WEBHOOK_SECRET }}
      E2E_BASE_URL: ${{ vars.SITE_URL }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ADMIN_TOTP_SECRET: ${{ secrets.E2E_ADMIN_TOTP_SECRET }}
      E2E_HAS_DB: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate staging isolation and required test credentials
        run: |
          node scripts/prepare-staging.mjs
          node -e 'for (const k of ["E2E_ADMIN_EMAIL","E2E_ADMIN_PASSWORD","E2E_ADMIN_TOTP_SECRET"]) if (!process.env[k]) throw new Error("Missing " + k)'
      - run: npm run test:unit
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Apply deployment with server-only secrets
        run: npx wrangler deploy --config .deploy/staging.json --secrets-file .deploy/secrets.json
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (required authenticated cases enabled)
        run: npx playwright test --workers=1 --reporter=json > staging-tests.json
      - name: Reject skipped or failed acceptance cases
        if: always()
        run: node -e 'const r=JSON.parse(require("fs").readFileSync("staging-tests.json","utf8")); if(r.stats.skipped || r.stats.unexpected || r.stats.flaky || r.errors?.length) throw new Error("Staging acceptance requires all cases to pass without skips or retries")'
      - name: Remove private deployment files
        if: always()
        run: rm -rf .deploy
